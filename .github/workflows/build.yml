name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/src-tauri/whisper-cpu-portable.cmake
      CMAKE_GENERATOR: Visual Studio 17 2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install LLVM & CMake
        run: |
          choco install llvm cmake --yes
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\lib" >> $env:GITHUB_ENV

      - name: Install Vulkan SDK
        run: |
          $version = "1.4.363.0"
          $sdk = "C:\VulkanSDK\$version"
          $installer = Join-Path $env:RUNNER_TEMP "vulkansdk-windows-X64-$version.exe"
          $url = "https://vulkan.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe"
          $expectedSha256 = "94a82d378f7a5e3e54c9db7d2fb7016af136e14ac0a18dbf0f2f67a36352d141"

          Invoke-WebRequest -Uri $url -OutFile $installer
          $actualSha256 = (Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Vulkan SDK installer checksum mismatch."
          }

          $process = Start-Process -FilePath $installer -ArgumentList @(
            "--root", $sdk, "--accept-licenses", "--default-answer", "--confirm-command", "install"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Vulkan SDK installer failed with exit code $($process.ExitCode)."
          }
          if (-not (Test-Path "$sdk\Include\vulkan\vulkan.h") -or
              -not (Test-Path "$sdk\Lib\vulkan-1.lib") -or
              -not (Test-Path "$sdk\Bin\glslc.exe")) {
            throw "Vulkan SDK installation is missing required headers, libraries, or shader compiler."
          }

          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          "$sdk\Bin" >> $env:GITHUB_PATH

      - name: Prepare Vulkan loader resource
        run: node scripts/prepare-vulkan-loader.js

      - name: Install frontend dependencies
        run: npm ci

      - name: Clean host-specific Whisper build cache
        run: cargo clean --manifest-path src-tauri/Cargo.toml -p whisper-rs-sys

      - name: Run Rust backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

      - name: Build Windows installer
        run: npm run build:windows

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            architecture: intel
          - target: aarch64-apple-darwin
            architecture: apple-silicon
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build macOS installer
        run: npx tauri build --target ${{ matrix.target }} --bundles dmg

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos-${{ matrix.architecture }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Interview Buddy ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Downloads

            - **Windows 10/11**: Download the `.exe` installer.
            - **macOS Intel**: Download the Intel `.dmg`.
            - **macOS Apple Silicon**: Download the Apple Silicon `.dmg`.

            The Windows installer automatically installs the WebView2 runtime if it is missing. The Whisper speech model is downloaded the first time audio transcription is used. A Gemini API key is required for AI-generated answers.

            macOS builds are unsigned; see the README for first-launch instructions.
          files: release-assets/*
